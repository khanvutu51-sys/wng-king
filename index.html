<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>41 Rules Pattern Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .header h1 {
            font-size: 18px;
            color: #38bdf8;
        }

        .header p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .card {
            background: #0f172a;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #334155;
        }

        .card-title {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .input-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }

        .btn-big-inp { background: #f59e0b; }
        .btn-small-inp { background: #3b82f6; }
        .btn-big-inp:active, .btn-small-inp:active { transform: scale(0.96); }

        .trend-chain {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 0;
            min-height: 40px;
            align-items: center;
        }

        .trend-pill {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
        }

        .prediction-box {
            text-align: center;
            padding: 15px;
            background: #1e293b;
            border-radius: 10px;
            border: 2px dashed #38bdf8;
        }

        .detected-pattern {
            font-size: 12px;
            color: #e2e8f0;
            background: #334155;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .pred-result {
            font-size: 26px;
            font-weight: 800;
            margin: 5px 0;
        }

        .confidence {
            font-size: 12px;
            color: #10b981;
            font-weight: 600;
        }

        .feedback-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }

        .btn-fb {
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            color: white;
        }
        .btn-win { background: #10b981; }
        .btn-loss { background: #ef4444; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            text-align: center;
        }

        .stat-item {
            background: #1e293b;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            color: #94a3b8;
        }

        .stat-item span {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            margin-top: 2px;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .bg-big { background-color: #f59e0b; }
        .bg-small { background-color: #3b82f6; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎯 41 Rules Custom Pattern Analyzer</h1>
            <p>আপনার রুলভিত্তিক নিখুঁত প্যাটার্ন প্রেডিক্টর</p>
        </div>

        <div class="card">
            <div class="card-title">গেমের রেজাল্ট ইনপুট দিন</div>
            <div class="input-buttons">
                <button class="btn-input btn-big-inp" onclick="addGameData('Big')">+ BIG</button>
                <button class="btn-input btn-small-inp" onclick="addGameData('Small')">+ SMALL</button>
            </div>
            
            <div style="margin-top: 12px;">
                <div class="action-row">
                    <span style="font-size: 11px; color: #94a3b8;">আপনার দেওয়া ইনপুট চেইন:</span>
                    <button class="btn-reset" onclick="resetAllData()">Clear Data</button>
                </div>
                <div class="trend-chain" id="trendChain">
                    <span style="font-size: 11px; color: #64748b;">ডাটা ইনপুট দেওয়া শুরু করুন...</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">প্যাটার্ন অ্যানালিসিস ও আউটপুট</div>
            <div class="prediction-box">
                <div class="detected-pattern" id="detectedPattern">প্যাটার্ন: ইনপুটের অপেক্ষায়</div>
                <div class="pred-result" id="predResult" style="color: #64748b;">--</div>
                <div class="confidence" id="confidence">ইনপুট দিলে রুলস ম্যাচ করে প্রেডিকশন দেবে</div>
            </div>

            <div class="feedback-box" id="feedbackBox" style="display: none;">
                <button class="btn-fb btn-win" onclick="recordFeedback(true)">WIN 👍</button>
                <button class="btn-fb btn-loss" onclick="recordFeedback(false)">LOSS 👎</button>
            </div>
        </div>

        <div class="card">
            <div class="stats-grid">
                <div class="stat-item">মোট<span id="statTotal">0</span></div>
                <div class="stat-item">Win<span id="statWin" style="color: #10b981;">0</span></div>
                <div class="stat-item">Loss<span id="statLoss" style="color: #ef4444;">0</span></div>
                <div class="stat-item">Accuracy<span id="statRate" style="color: #38bdf8;">0%</span></div>
            </div>
        </div>
    </div>

    <script>
        // ৪১টি কাস্টম রুলস এর তালিকা
        const rulesDatabase = [
            { id: 1, pattern: [4, 2, 1, 2, 4] },
            { id: 2, pattern: [1, 3, 1, 3, 1, 3] },
            { id: 3, pattern: [1, 1, 1, 2, 1, 3] },
            { id: 4, pattern: [2, 2, 3, 3, 4, 4] },
            { id: 5, pattern: [1, 2, 3, 4] },
            { id: 6, pattern: [4, 3, 2, 1] },
            { id: 7, pattern: [1, 1, 2, 2, 3, 3] },
            { id: 8, pattern: [2, 3, 1, 3, 2] },
            { id: 9, pattern: [1, 2, 4, 8] },
            { id: 10, pattern: [1, 3, 1, 3] },
            { id: 11, pattern: [2, 3, 2, 3] },
            { id: 12, pattern: [1, 1, 2, 1, 3, 1] },
            { id: 13, pattern: [2, 1, 2, 2, 2, 3] },
            { id: 14, pattern: [4, 1, 4, 1] },
            { id: 15, pattern: [4, 2, 4, 2] },
            { id: 16, pattern: [4, 3, 4, 3] },
            { id: 17, pattern: [1, 1, 1, 1] },
            { id: 18, pattern: [1, 2] },
            { id: 19, pattern: [1, 3] },
            { id: 20, pattern: [1, 4] },
            { id: 21, pattern: [2, 2] },
            { id: 22, pattern: [2, 3] },
            { id: 23, pattern: [2, 4] },
            { id: 24, pattern: [3, 3] },
            { id: 25, pattern: [3, 4] },
            { id: 26, pattern: [4, 4] },
            { id: 27, pattern: [5] },
            { id: 28, pattern: [4, 1] },
            { id: 29, pattern: [3, 1] },
            { id: 30, pattern: [2, 1] },
            { id: 31, pattern: [4, 2] },
            { id: 32, pattern: [3, 2] },
            { id: 33, pattern: [4, 3] },
            { id: 34, pattern: [8] },
            { id: 35, pattern: [1, 2, 1, 2, 3, 2, 1, 1, 3, 1, 1, 1, 2] },
            { id: 36, pattern: [1, 2, 1, 3, 1, 2, 1, 2, 1, 1, 1, 1] },
            { id: 37, pattern: [1, 3, 1, 1, 1, 3, 1] },
            { id: 38, pattern: [1, 3, 1, 2] },
            { id: 39, pattern: [2, 2, 4, 1, 1, 3, 1] },
            { id: 40, pattern: [2, 4] },
            { id: 41, pattern: [1, 1, 2] }
        ];

        let inputHistory = [];
        let totalWins = 0;
        let totalLosses = 0;
        let currentPrediction = null;

        function addGameData(type) {
            inputHistory.push(type);
            updateTrendChainUI();
            analyze41Rules();
        }

        function updateTrendChainUI() {
            const container = document.getElementById('trendChain');
            if (inputHistory.length === 0) {
                container.innerHTML = '<span style="font-size: 11px; color: #64748b;">ডাটা ইনপুট দেওয়া শুরু করুন...</span>';
                return;
            }

            container.innerHTML = inputHistory.map(item => `
                <span class="trend-pill ${item === 'Big' ? 'bg-big' : 'bg-small'}">${item}</span>
            `).join('');

            container.scrollLeft = container.scrollWidth;
        }

        // ইনপুট সিকোয়েন্সকে রান-লেংথ (Block Array)-এ রূপান্তর করার ফাংশন
        function getRunLengthArray(arr) {
            if (arr.length === 0) return [];
            let runs = [];
            let currentLen = 1;

            for (let i = 1; i < arr.length; i++) {
                if (arr[i] === arr[i - 1]) {
                    currentLen++;
                } else {
                    runs.push(currentLen);
                    currentLen = 1;
                }
            }
            runs.push(currentLen);
            return runs;
        }

        function analyze41Rules() {
            const predResultElem = document.getElementById('predResult');
            const patternElem = document.getElementById('detectedPattern');
            const confElem = document.getElementById('confidence');
            const feedbackBox = document.getElementById('feedbackBox');

            if (inputHistory.length === 0) {
                patternElem.innerText = "প্যাটার্ন: ইনপুটের অপেক্ষায়";
                predResultElem.innerText = "--";
                predResultElem.style.color = "#64748b";
                confElem.innerText = "ইনপুট দিলে রুলস ম্যাচ করে প্রেডিকশন দেবে";
                feedbackBox.style.display = 'none';
                return;
            }

            const currentRuns = getRunLengthArray(inputHistory);
            const lastType = inputHistory[inputHistory.length - 1];

            let matchedRule = null;
            let predictedNext = null;
            let matchConfidence = 0;

            // ৪১টি রুলসের সাথে ম্যাচ করানো (দীর্ঘতম রুলসকে আগে অগ্রাধিকার দেওয়া হবে)
            let sortedRules = [...rulesDatabase].sort((a, b) => b.pattern.length - a.pattern.length);

            for (let ruleObj of sortedRules) {
                let rule = ruleObj.pattern;
                let cLen = currentRuns.length;

                // কেইস ১: বর্তমান ট্রেন্ড রুলসের মাঝামাঝি কোনো ব্লক ম্যাচ করে পরবর্তী ব্লক কী হবে তা বের করা
                if (cLen <= rule.length) {
                    let isMatch = true;
                    for (let i = 0; i < cLen - 1; i++) {
                        if (currentRuns[i] !== rule[i]) {
                            isMatch = false;
                            break;
                        }
                    }

                    if (isMatch) {
                        let currentBlockLen = currentRuns[cLen - 1];
                        let targetBlockLen = rule[cLen - 1];

                        if (currentBlockLen < targetBlockLen) {
                            // ওই একই ব্লকের ট্রেন্ড বজায় থাকবে
                            predictedNext = lastType;
                            matchedRule = ruleObj;
                            matchConfidence = Math.min(60 + (cLen * 8), 95);
                            break;
                        } else if (currentBlockLen === targetBlockLen) {
                            // ব্লক শেষ, তাই কালার/সাইড চেঞ্জ হবে
                            if (cLen < rule.length) {
                                predictedNext = (lastType === 'Big') ? 'Small' : 'Big';
                                matchedRule = ruleObj;
                                matchConfidence = Math.min(65 + (cLen * 8), 98);
                                break;
                            }
                        }
                    }
                }
            }

            // যদি কোনো কাস্টম রুলস সরাসরি ম্যাচ না করে তবে ডিফল্ট লজিক
            if (!predictedNext) {
                predictedNext = (lastType === 'Big') ? 'Small' : 'Big';
                matchedRule = { id: 'General', pattern: [] };
                matchConfidence = 65;
            }

            currentPrediction = predictedNext;

            // UI আপডেট
            patternElem.innerText = matchedRule.id === 'General' ? 
                `প্যাটার্ন: General Reversal` : 
                `ম্যাচ করেছে: Rule #${matchedRule.id} [${matchedRule.pattern.join('-')}]`;

            predResultElem.innerText = `NEXT: ${predictedNext}`;
            predResultElem.style.color = predictedNext === 'Big' ? '#f59e0b' : '#3b82f6';
            confElem.innerText = `Rule Accuracy Match: ${matchConfidence}%`;

            feedbackBox.style.display = 'flex';
        }

        function recordFeedback(isWin) {
            if (!currentPrediction) return;

            if (isWin) {
                totalWins++;
                inputHistory.push(currentPrediction);
            } else {
                totalLosses++;
                let actual = currentPrediction === 'Big' ? 'Small' : 'Big';
                inputHistory.push(actual);
            }

            updateTrendChainUI();
            updateStatsUI();
            analyze41Rules();
        }

        function updateStatsUI() {
            let total = totalWins + totalLosses;
            let rate = total > 0 ? Math.round((totalWins / total) * 100) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statWin').innerText = totalWins;
            document.getElementById('statLoss').innerText = totalLosses;
            document.getElementById('statRate').innerText = `${rate}%`;
        }

        function resetAllData() {
            if (confirm("সব ইনপুট ডাটা রিসেট করতে চান?")) {
                inputHistory = [];
                totalWins = 0;
                totalLosses = 0;
                currentPrediction = null;
                updateTrendChainUI();
                updateStatsUI();
                analyze41Rules();
            }
        }
    </script>
</body>
</html>

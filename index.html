<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wingo Analyzer</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
font-family:'Roboto',sans-serif;
-webkit-tap-highlight-color:transparent
}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:12px;
background:linear-gradient(-45deg,
#0f2027,
#203a43,
#2c5364,
#141e30,
#243b55);
background-size:500% 500%;
animation:bgMove 14s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* GLASS CARD */
.page{
display:none;
width:100%;
max-width:440px;
padding:22px;
border-radius:22px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.25);
box-shadow:
0 0 30px rgba(0,255,255,0.15),
0 20px 40px rgba(0,0,0,.45);
animation:fadeUp .5s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

h2{
text-align:center;
margin-bottom:15px;
color:#fff;
text-shadow:0 0 8px rgba(0,255,255,.6)
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:14px;
font-size:15px;
outline:none;
}

input{
border:none;
background:rgba(255,255,255,0.9);
}

button{
border:none;
font-weight:600;
cursor:pointer;
transition:.3s;
}

/* BUTTONS */
.btn-primary{
background:linear-gradient(135deg,#00c6ff,#0072ff);
color:#fff;
box-shadow:0 0 12px rgba(0,198,255,.6)
}

.btn-primary:hover{
transform:scale(1.04);
box-shadow:0 0 20px rgba(0,198,255,1)
}

.btn-secondary{
background:linear-gradient(135deg,#555,#222);
color:#fff;
}

.center{
text-align:center;
color:#fff;
}

/* SERVER BUTTONS */
.server-btn{
height:72px;
border-radius:50px;
font-size:18px;
margin-top:16px;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 25px rgba(0,0,0,.5);
transition:.3s;
}

.server-btn:hover{
transform:scale(1.05);
}

.hgzy{background:linear-gradient(135deg,#00f260,#0575e6)}
.dkwin{background:linear-gradient(135deg,#f7971e,#ffd200)}

/* STATS */
.stat{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

.stat div{
background:rgba(255,255,255,0.9);
padding:8px;
border-radius:10px;
text-align:center;
font-weight:600;
}

/* HISTORY */
#history{
max-height:150px;
overflow:auto;
margin-top:12px;
}

#history div{
padding:6px;
border-radius:8px;
color:#fff;
margin-bottom:6px;
text-align:center;
}

.chart{margin-top:12px}
.bar{height:18px;border-radius:10px;margin-top:6px}
.win{background:#38a169}
.loss{background:#e53e3e}

#timer{
color:#ffeb3b;
font-weight:bold;
text-align:center;
margin-top:8px;
text-shadow:0 0 8px rgba(255,235,59,.8)
}
</style>
</head>

<body>

<!-- SIGNUP -->
<div class="page" id="page1">
<h2>Signup</h2>

<input id="suName" placeholder="Full Name">
<input id="suUser" placeholder="Username">
<input id="suEmail" type="email" placeholder="Email">
<input id="suMobile" type="tel" placeholder="Mobile Number">

<div style="position:relative">
<input id="suPass" type="password" placeholder="Password">
<span onclick="togglePass('suPass',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#000">Show</span>
</div>

<div style="position:relative">
<input id="suCPass" type="password" placeholder="Confirm Password">
<span onclick="togglePass('suCPass',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#000">Show</span>
</div>

<button class="btn-primary" onclick="signup()">Signup</button>
<button class="btn-secondary" onclick="goToPage(4)">Back to Login</button>
<p id="msg1" class="center"></p>
</div>

<!-- LOGIN -->
<div class="page" id="page4" style="display:block">
<h2>Login</h2>
<input id="liUser" placeholder="Username or Mobile">

<div style="position:relative">
<input id="liPass" type="password" placeholder="Password">
<span onclick="togglePass('liPass',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#000">Show</span>
</div>

<button class="btn-primary" onclick="login()">Login</button>
<button class="btn-secondary" onclick="goToPage(1)">Signup</button>
<p id="msg2" class="center"></p>
</div>

<!-- MAIN -->
<div class="page" id="page2">
<h2>Select Server</h2>
<button class="server-btn hgzy" onclick="selectServer('HGZY')">HGZY GAME SERVER</button>
<button class="server-btn dkwin" onclick="selectServer('DKWIN')">DKWIN GAME SERVER</button>
<button class="btn-secondary" onclick="logout()">Logout</button>
</div>

<!-- RESULT -->
<div class="page" id="page3">
<h2 id="serverTitle"></h2>

<input id="num" maxlength="1" placeholder="0-9">
<button id="resBtn" class="btn-primary" onclick="showResult()">Show Result</button>

<div id="numberText" class="center"></div>
<div id="resultText" class="center"></div>
<div id="timer"></div>

<div class="stat">
<div id="wC">Win: 0</div>
<div id="lC">Loss: 0</div>
<div id="wP">Win %: 0%</div>
<div id="lP">Loss %: 0%</div>
</div>

<div class="chart">
<div class="bar win" id="winBar"></div>
<div class="bar loss" id="lossBar"></div>
</div>

<button class="btn-primary" onclick="add('Win')">Win</button>
<button class="btn-secondary" onclick="add('Loss')">Loss</button>

<div id="history"></div>

<button class="btn-secondary" onclick="clearHistory()">Clear History</button>
<button class="btn-secondary" onclick="goToPage(2)">Back</button>
</div>

<script>
let user=JSON.parse(localStorage.getItem("user"));
let data=JSON.parse(localStorage.getItem("serverData"))||{};
let server="",lock=false,timerI;

function goToPage(p){
document.querySelectorAll(".page").forEach(x=>x.style.display="none");
document.getElementById("page"+p).style.display="block";
}

function togglePass(id,el){
let i=document.getElementById(id);
i.type=i.type==="password"?"text":"password";
el.innerText=i.type==="password"?"Show":"Hide";
}

function signup(){
const u={
name:suName.value.trim(),
user:suUser.value.trim(),
email:suEmail.value.trim(),
mobile:suMobile.value.trim(),
pass:suPass.value
};
if(!u.name||!u.user||!u.email||!u.mobile||!u.pass||!suCPass.value){
msg1.innerText="সব তথ্য পূরণ করুন";return}
if(u.pass!==suCPass.value){
msg1.innerText="Password মিলছে না";return}
localStorage.setItem("user",JSON.stringify(u));
msg1.innerText="Signup Successful ✅";
setTimeout(()=>goToPage(4),1000);
}

function login(){
user=JSON.parse(localStorage.getItem("user"));
if(!user){msg2.innerText="Signup করুন";return}
if((liUser.value===user.user||liUser.value===user.mobile)&&liPass.value===user.pass){
goToPage(2)
}else msg2.innerText="ভুল তথ্য";
}

function logout(){server="";goToPage(4)}

function selectServer(s){
server=s;
if(!data[s])data[s]=[];
serverTitle.innerText=s+" SERVER";
goToPage(3);
render();
}

function showResult(){
if(lock)return;
let v=num.value;
if(v===""||v<0||v>9){alert("0-9 এর মধ্যে সংখ্যা দিন");return}
let result=Math.random()<0.5?"Small":"Big";
numberText.innerText="Your Number: "+v;
resultText.innerText="Result: "+result;
startTimer();
}

function startTimer(){
lock=true;let t=20;
resBtn.disabled=true;num.disabled=true;
timer.innerText="Wait: "+t+"s";
timerI=setInterval(()=>{
t--;timer.innerText="Wait: "+t+"s";
if(t<=0){
clearInterval(timerI);lock=false;
timer.innerText="";resBtn.disabled=false;num.disabled=false}
},1000)
}

function add(v){
data[server].unshift(v);
localStorage.setItem("serverData",JSON.stringify(data));
render();
}

function render(){
let h=data[server];
history.innerHTML=h.length
?h.map(x=>`<div style="background:${x==='Win'?'#38a169':'#e53e3e'}">${x}</div>`).join("")
:"<div style='background:#777'>No History</div>";
let w=h.filter(x=>x==="Win").length;
let l=h.filter(x=>x==="Loss").length;
let t=w+l;
wC.innerText="Win: "+w;
lC.innerText="Loss: "+l;
wP.innerText="Win %: "+(t?(w/t*100).toFixed(1):0)+"%";
lP.innerText="Loss %: "+(t?(l/t*100).toFixed(1):0)+"%";
winBar.style.width=(t?(w/t*100):0)+"%";
lossBar.style.width=(t?(l/t*100):0)+"%";
}

function clearHistory(){
if(confirm("History clear করবেন?")){
data[server]=[];
localStorage.setItem("serverData",JSON.stringify(data));
render();
}
}
</script>

</body>
</html>
